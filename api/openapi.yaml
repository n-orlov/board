openapi: 3.1.0
info:
  title: Board API
  version: 0.1.0
  summary: The board server's HTTP API.
  description: >-
    The document declares the probe, documentation, browser-login, API-key, initiative, task, event, lease and check-in operations.
    Every later operation is added here first; the Go server code and the TypeScript client are generated from
    this document and ci/lint.sh fails when either is stale.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: probes
    description: Liveness and readiness.
  - name: docs
    description: This document and the interactive API documentation.
  - name: auth
    description: Browser login through OpenID Connect, and the browser session.
  - name: keys
    description: API keys for agents, created, listed and revoked by any authenticated principal.
  - name: initiatives
    description: Initiatives, the groups of tasks, with tags.
  - name: tasks
    description: Tasks, the units of work and the watches, created, read and edited.
  - name: leases
    description: Leases, the claims an actor makes on a task, with their expiry and conflicts.
  - name: events
    description: The audit trail, listed with filters and paging.
  - name: meta
    description: The server's versions, the caller, and the agent protocol the caller has read.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [probes]
      summary: Liveness probe
      description: Answers 200 whenever the process is up. The only unauthenticated operation.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [probes]
      summary: Readiness probe
      description: >-
        Answers 200 when the database is reachable and migrated, 503 otherwise.
        A presented key the database cannot check also gets 503, as a problem document.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The server is ready.
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The server is not ready.
          content:
            text/plain:
              schema:
                type: string
                examples: [not ready]
  /api/openapi.yaml:
    get:
      operationId: getOpenapiYAML
      tags: [docs]
      summary: This document as YAML
      description: Serves api/openapi.yaml, the source of truth for the API.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/openapi.json:
    get:
      operationId: getOpenapiJSON
      tags: [docs]
      summary: This document as JSON
      description: The same document as /api/openapi.yaml, converted to JSON.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/docs:
    get:
      operationId: getDocs
      tags: [docs]
      summary: Interactive API documentation
      description: >-
        Swagger UI, served from assets embedded in the binary, listing every
        operation of this document. Its Authorize button takes a `bearerAuth` key.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The documentation page.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/docs/assets/{name}:
    get:
      operationId: getDocsAsset
      tags: [docs]
      summary: A Swagger UI asset
      description: A script or stylesheet of the page at /api/docs, embedded in the binary.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The asset's file name.
          schema:
            type: string
      responses:
        "200":
          description: The asset.
          content:
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List the API keys
      description: >-
        Every key, oldest first. A key is described by its name and display prefix
        only: the key itself is shown once, by the response that created it, and is
        stored nowhere.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createKey
      tags: [keys]
      summary: Create an API key
      description: >-
        Makes a key called `name`, with an optional expiry, and returns the key in
        `key` exactly once. Appends a `key_created` event that records the
        caller's principal and `Board-Actor` handle in separate columns.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCreate"
      responses:
        "201":
          description: The key was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/keys/{name}/revoke:
    post:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke an API key
      description: >-
        Sets `revoked_at`, so the key gets 401 from its next request on. Revoking a
        revoked key changes nothing and answers 200 with the first revocation time.
        A revocation that happens appends a `key_revoked` event.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The key's name.
          schema:
            type: string
      responses:
        "200":
          description: The key, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives:
    get:
      operationId: listInitiatives
      tags: [initiatives]
      summary: List the initiatives
      description: >-
        A page of initiatives ordered by id (creation order). `tag` may repeat and keeps
        the initiatives that carry every tag given. `limit` is 1 to 1000, default 100.
        `after` is the id or slug of the last initiative of the previous page; the
        response's `next_after` is the value to send, and is absent on the last page.
        `status` is `open` (the default), `closed` or `all`. `closed_within` keeps the
        initiatives closed in the last 7d, 30d, 90d or an integer of days, and needs
        `status` `closed` or `all` (with `all` the open initiatives stay); with `open` it is 400.
        Each item carries the `counts` of its tasks by status and its `live_leases`. Before it
        reads, the list expires the leases whose `expires_at` has passed.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          description: Keep initiatives that carry this tag. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: Which initiatives to keep. Default `open`.
          schema:
            type: string
            enum: [open, closed, all]
        - name: closed_within
          in: query
          required: false
          description: "`7d`, `30d`, `90d` or an integer of days. Only with `status` `closed` or `all`."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The page size, 1 to 1000. Default 100.
          schema:
            type: integer
        - name: after
          in: query
          required: false
          description: An initiative ULID or slug, in either letter case. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createInitiative
      tags: [initiatives]
      summary: Create an initiative
      description: >-
        Makes an initiative with a slug of 2 to 40 characters of `a-z`, `0-9` and `-`.
        A slug already taken is 409 with a `next` that says how to read it. Appends an
        `initiative_created` event that records the caller's principal and `Board-Actor`
        handle in separate columns, and upserts the actor.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeCreate"
      responses:
        "201":
          description: The initiative was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}:
    get:
      operationId: getInitiative
      tags: [initiatives]
      summary: Read an initiative
      description: The initiative whose slug (its ref) or ULID is given.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      responses:
        "200":
          description: The initiative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: patchInitiative
      tags: [initiatives]
      summary: Edit an initiative
      description: >-
        Changes the fields sent. A field left out keeps its value, `tags` replaces the set, and `null` clears
        `target_start` and `target_end` and is 400 for the others. The same field rules as a create apply to the
        initiative as it would be after the patch. `slug` is immutable, and sending it, even unchanged, is 400. A
        patch that changes nothing, such as `{}`, answers 200 and writes no row, event or actor. A change appends
        `initiative_updated` whose `data.changed` names the changed fields. An unknown initiative is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativePatch"
      responses:
        "200":
          description: The initiative after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}/close:
    post:
      operationId: closeInitiative
      tags: [initiatives]
      summary: Close an initiative
      description: >-
        Closes an open initiative, setting `closed_at` and `closed_by` and appending `initiative_closed`. An initiative
        with no task that is not closed closes at once. With an open or done task and no `force`, the answer is 409 and
        its `next` names the `force` option. With `force` true every task that is not closed is first closed
        `dropped`, each with its `task_closed` event, and then the initiative closes, all in one transaction. A closed
        initiative cannot take new tasks or edits to its tasks, and closing a closed initiative is 409. An unknown
        initiative is 404. A `Board-On-Behalf-Of` header is stored as the `on_behalf_of` of the events.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeClose"
      responses:
        "200":
          description: The initiative after the close.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}/reopen:
    post:
      operationId: reopenInitiative
      tags: [initiatives]
      summary: Reopen a closed initiative
      description: >-
        Reopens a closed initiative, clearing `closed_at` and `closed_by` and appending `initiative_reopened`. Its
        tasks stay closed. Reopening an open initiative is 409. An unknown initiative is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      responses:
        "200":
          description: The initiative after the reopen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the tasks
      description: >-
        A page of tasks ordered by id (creation order), each with its live leases. Filters combine.
        `initiative` (slug or ULID) and `tag` (an initiative tag) may repeat: a task is kept when it is in any of the
        initiatives given and its initiative carries every tag given. `status` is `open`, `done`, `closed`,
        `not_closed` (the default) or `all`. `kind` is `work` or `watch`. `active` (has a live lease), `blocked` (has
        an open dependency) and `overdue` (a watch task past its `next_check_at`) are `true` or `false`.
        `closed_within` (`7d`, `30d`, `90d` or an integer of days) is for `status` `closed` or `all`: it keeps the
        tasks closed within that many days and, with `all`, the tasks that are not closed. `q` keeps the tasks whose
        title or description contains the text, ignoring letter case. `limit` is 1 to 1000, default 100. `after` is
        the id or ref of the last task of the previous page; the response's `next_after` is the value to send, and is
        absent on the last page. Overdue leases are expired before the list is read, so a task whose lease ran out is
        not active. An initiative that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: initiative
          in: query
          required: false
          description: Keep tasks of this initiative, by slug or ULID. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tag
          in: query
          required: false
          description: Keep tasks whose initiative carries this tag. Repeatable; every tag given must match.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: The task status to keep. Default `not_closed`.
          schema:
            type: string
            enum: [open, done, closed, not_closed, all]
        - name: kind
          in: query
          required: false
          description: Keep tasks of this kind.
          schema:
            type: string
            enum: [work, watch]
        - name: active
          in: query
          required: false
          description: "`true` keeps tasks with a live lease, `false` those without."
          schema:
            type: boolean
        - name: blocked
          in: query
          required: false
          description: "`true` keeps tasks with an open dependency, `false` those without."
          schema:
            type: boolean
        - name: overdue
          in: query
          required: false
          description: "`true` keeps overdue watch tasks, `false` the tasks that are not overdue."
          schema:
            type: boolean
        - name: closed_within
          in: query
          required: false
          description: "`7d`, `30d`, `90d` or an integer of days. Only with `status` `closed` or `all`."
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: A text that the title or the description contains, in either letter case.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The page size, 1 to 1000. Default 100.
          schema:
            type: integer
        - name: after
          in: query
          required: false
          description: A task ULID or ref, in either letter case. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: >-
        Makes a task in an open initiative, numbered `<slug>-<seq>` from 1 within it and never reused.
        `kind` is `work` (the default) or `watch`. A watch task needs `cadence_seconds` (60 to 31536000) and
        its `next_check_at` defaults to now plus the cadence. A work task that sends either watch field is 400.
        `blocked_by` names tasks (ref or ULID) the new task starts out blocked by. A bad field is 400 and
        writes no row, event or actor. An unknown initiative or blocker is 404 and a closed initiative is 409.
        Appends `task_created`, and `dep_added` for each blocker.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The task was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Read a task
      description: >-
        The task whose ref (`<slug>-<seq>`) or ULID is given, in either letter case, with the tasks it is blocked
        by (`deps`), the tasks it blocks (`blocking`), its live leases and the derived `active`, `blocked` and
        `overdue`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: patchTask
      tags: [tasks]
      summary: Edit a task
      description: >-
        Changes the fields sent. A field left out keeps its value, `null` clears `planned_start`, `planned_end` and
        `next_check_at`, a watch task's `cadence_seconds` cannot be cleared (`null` is 400) and stays 60 to 31536000,
        and `external_refs` replaces the list. `kind` and `initiative` are
        immutable, and sending either is 400. A patch that changes nothing answers 200 and writes no row, event or
        actor. A change appends `task_updated` whose `data.changed` names the changed fields. A closed task, or a
        task of a closed initiative, is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The task after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/done:
    post:
      operationId: doneTask
      tags: [tasks]
      summary: Mark a task done
      description: >-
        Moves an open task to `done`, setting `done_at` and `done_by`, and appends `task_done`. A task that is
        already done or is closed is 409 and the problem names its current status.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/reopen:
    post:
      operationId: reopenTask
      tags: [tasks]
      summary: Reopen a task
      description: >-
        Moves a done or closed task back to `open`, clearing `resolution`, `done_at`, `done_by`, `closed_at` and
        `closed_by`, and appends `task_reopened`. An open task is 409 and the problem names its status. A task of
        a closed initiative is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/close:
    post:
      operationId: closeTask
      tags: [tasks]
      summary: Close a task
      description: >-
        Moves an open or done task to `closed` with the `resolution` sent (`completed`, `dropped`, `superseded` or
        `duplicate`), setting `closed_at` and `closed_by`, and appends `task_closed` whose `data.resolution` is the
        resolution. A missing or unknown resolution is 400. A closed task is 409 and the problem names its status.
        A `Board-On-Behalf-Of` header names the actor the close is made for, such as `operator` when an agent
        closes on instruction, and is stored as the event's `on_behalf_of`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClose"
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/deps/{blockedByRef}:
    post:
      operationId: addTaskDep
      tags: [tasks]
      summary: Make a task blocked by another
      description: >-
        Makes the task `ref` blocked by the task `blockedByRef`, which may be in another initiative, and appends
        `dep_added` on `ref` whose `data.blocked_by` is the blocker's ref. Answers 200 with the dependent task.
        Adding a dependency that exists is 200 too and writes nothing. A task blocked by itself is 400. A
        dependency that would close a cycle of any length is 409 and the problem's `detail` names the path. An
        unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/BlockedByRef"
      responses:
        "200":
          description: The dependent task, with its `deps`, `blocking` and derived `blocked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeTaskDep
      tags: [tasks]
      summary: Remove a task's dependency on another
      description: >-
        Removes the dependency of the task `ref` on the task `blockedByRef` and appends `dep_removed` on `ref`
        whose `data.blocked_by` is the blocker's ref. Answers 200 with the dependent task. A dependency that does
        not exist, or an unknown task, is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/BlockedByRef"
      responses:
        "200":
          description: The dependent task after the removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/checks:
    post:
      operationId: recordTaskCheck
      tags: [tasks]
      summary: Record a check on a watch task
      description: >-
        Appends `check_recorded` on a watch task and moves its `next_check_at` to the time sent, or to now plus the
        task's cadence when none is sent. Answers 200 with the task. A work task, or a closed watch task, is 409. A
        `summary` that is empty or longer than 200 characters is 400. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCheck"
      responses:
        "200":
          description: The task, with its new `next_check_at` and derived `overdue`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/milestones:
    post:
      operationId: recordTaskMilestone
      tags: [tasks]
      summary: Record a milestone on a task
      description: >-
        Appends `milestone` on a task of any kind and status; the task row is not touched. The event's `data` carries
        the task `ref`, the `summary` and, when sent, the caller's `data` object under the key `data`. Answers 200
        with the task. A `summary` that is empty or longer than 200 characters is 400. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMilestone"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: List a task's events
      description: >-
        A page of the events that name the task, in the order they were written. `limit` is 1 to 1000, default 100.
        `after` is the id or `E<n>` ref of the last event of the previous page; the response's `next_after` is the
        value to send, and is absent on the last page. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/EventLimit"
        - $ref: "#/components/parameters/EventAfter"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      description: >-
        A page of events in the order they were written. Filters combine: `since` keeps the events after an event
        (its id or `E<n>` ref) or from an RFC 3339 time on, `initiative` (slug or ULID) and `task` (ref or ULID) keep
        the events that name them, `type` keeps the events of any of the types given and `actor` those of one
        handle. `limit` is 1 to 1000, default 100. `after` is the id or `E<n>` ref of the last event of the previous
        page; the response's `next_after` is the value to send, and is absent on the last page. An initiative or
        task filter that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: An event id, an `E<n>` ref (either letter case) or an RFC 3339 time.
          schema:
            type: string
        - name: initiative
          in: query
          required: false
          description: An initiative slug or ULID.
          schema:
            type: string
        - name: task
          in: query
          required: false
          description: A task ref or ULID.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Keep events of this type. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: actor
          in: query
          required: false
          description: Keep the events of this actor handle.
          schema:
            type: string
        - $ref: "#/components/parameters/EventLimit"
        - $ref: "#/components/parameters/EventAfter"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases:
    post:
      operationId: startLease
      tags: [leases]
      summary: Start a lease
      description: >-
        Starts a lease for the caller on `task` with the `intent` (1 to 200 characters), answering the lease and the
        conflicts. `ttl_seconds` is clamped to 60 to 43200 and defaults to 7200. `resources` is at most 20 strings of
        1 to 100 characters, repeats dropped. A closed task is 409 and an unknown task 404. When the caller already
        holds a live lease on the task, that lease is renewed instead (same lease, 200, `lease_renewed`); otherwise the
        answer is 201 and the event `lease_started`. `conflicts` lists the live leases of others that hold one of the
        same resources, each with only the shared resources.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseStart"
      responses:
        "201":
          description: A new lease was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResult"
        "200":
          description: The actor already held a live lease on the task, and it was renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listLeases
      tags: [leases]
      summary: List leases
      description: >-
        A page of leases, oldest first, after expiring the leases that are due. Filters combine: `state` is `live`
        (the default), `ended`, `expired` or `all`; `actor` keeps the leases of one handle, `task` (ref or ULID) those on
        one task and `resource` those holding that resource. `limit` is 1 to 1000, default 100. `after` is the `L<n>` ref or
        id of the last lease of the previous page; `next_after` is the value to send, absent on the last page. A `task`
        that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: live (default), ended, expired or all.
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Keep the leases of this actor handle.
          schema:
            type: string
        - name: task
          in: query
          required: false
          description: A task ref or ULID.
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: Keep the leases that hold this resource.
          schema:
            type: string
        - $ref: "#/components/parameters/EventLimit"
        - name: after
          in: query
          required: false
          description: A lease ref (`L<n>`) or id. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}:
    get:
      operationId: getLease
      tags: [leases]
      summary: Read a lease
      description: >-
        Reads one lease by `L<n>` ref (either letter case) or ULID, after expiring the leases that are due. 404 for none.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}/renew:
    post:
      operationId: renewLease
      tags: [leases]
      summary: Renew a lease
      description: >-
        Pushes `expires_at` to now plus the ttl (`ttl_seconds` clamped, or the lease's own) and may replace the `intent`
        and the `resources`; appends `lease_renewed`. Any actor may renew. An expired lease is 410 and the problem carries
        `expired_at`; an ended lease is 409. The answer is the lease and its conflicts.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRenew"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}/end:
    post:
      operationId: endLease
      tags: [leases]
      summary: End a lease
      description: >-
        Ends a live lease with the optional `outcome` (at most 200 characters) and appends `lease_ended`. `ended_by` is
        set when the caller is not the holder. A lease that is not live is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseEnd"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}/ack:
    post:
      operationId: ackLease
      tags: [leases]
      summary: Acknowledge an expired lease
      description: >-
        Records the caller's acknowledgement of an expired lease (`acked_at`, `acked_by`) and appends `lease_acked`;
        acknowledging it again changes nothing. A lease that has not expired is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/now:
    get:
      operationId: getNow
      tags: [leases]
      summary: Check in
      description: >-
        The check-in bundle of the caller, in its lease and conflict parts (the ask, note and attention parts arrive
        with a later phase). After expiring the leases that are due it answers the `actor`, `my_leases` (the caller's
        live leases, each with its task ref, `title` and `expires_at`), `others_leases` (the live leases of other
        actors) and `conflicts`: the live leases that hold a resource of one of the caller's live leases, and those of
        other actors that hold one of the `resources` given, each with only the shared resources. `resources` is a
        comma-separated list of at most 20 resources of 1 to 100 characters, to check before starting.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: resources
          in: query
          required: false
          description: Comma-separated resources to check for conflicts before starting.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Now"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Describe the server and the caller
      description: >-
        The server's version, the agent protocol version its binary embeds (the one
        `board help agent` prints), and who the caller is: the principal that
        authenticated and the actor it acts as. Reads nothing from the database.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The server and the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/actors/me/protocol-seen:
    put:
      operationId: putProtocolSeen
      tags: [meta]
      summary: Record that the calling actor has read an agent protocol version
      description: >-
        Sets the calling actor's `protocol_seen` to `version` when that is higher than
        what is recorded (the column holds the highest version read, so repeating a call,
        or sending an older version, changes nothing) and upserts the actor. A negative
        `version` is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtocolSeenRequest"
      responses:
        "200":
          description: The actor with the highest protocol version it has read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolSeen"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/login:
    get:
      operationId: getAuthLogin
      tags: [auth]
      summary: Start the browser login
      description: >-
        A browser navigation (a GET that accepts `text/html`) is redirected to the
        identity provider's authorization endpoint with PKCE (S256), `state` and
        `nonce`, and gets a short-lived HttpOnly pre-login cookie. Any other
        request with no credential is an API call and gets 401.
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The provider's authorization endpoint with the login's parameters.
              schema:
                type: string
            Set-Cookie:
              description: The pre-login cookie `board_login`, HttpOnly, Secure, SameSite=Lax, valid 10 minutes.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          description: >-
            Any status not listed here is a problem document. A login never answers
            2xx: it ends in a redirect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      tags: [auth]
      summary: Finish the browser login
      description: >-
        The fixed redirect URI registered with the identity provider, called with the
        query parameters `code`, `state` and, when the provider refused the login,
        `error`, and the pre-login cookie `board_login`. It spends the
        login's `state`, `nonce` and PKCE verifier, checks the ID token, admits only
        a verified email on the allowed list, and starts the session. Like
        `/auth/login` it answers a browser navigation, and any other request with
        no credential gets 401.
      security: []
      responses:
        "302":
          description: The login succeeded. Redirects to `/` and sets the session cookie `board_session`.
          headers:
            Location:
              description: Where the browser lands.
              schema:
                type: string
            Set-Cookie:
              description: The session cookie, HttpOnly, Secure, SameSite=Lax.
              schema:
                type: string
        "400":
          description: >-
            The callback does not belong to a login in progress (no pre-login
            cookie and so no PKCE verifier, `state` mismatch, no code) or the ID
            token carries another login's `nonce`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        default:
          description: >-
            Any status not listed here is a problem document. A login never answers
            2xx: it ends in a redirect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: The caller's browser session
      description: >-
        Describes the session the cookie names: the principal, the actor it acts
        as (the operator), and the session's CSRF token.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the browser session
      description: Deletes the session server-side and clears the cookie. A cookie-authenticated write needs the X-CSRF-Token header and a same-origin Origin (SPEC 3.2), or the request is refused with 403 before it runs.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The session is ended.
          headers:
            Set-Cookie:
              description: The session cookie, cleared.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key minted by `board admin keys create`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: board_session
      description: The operator's browser session.
  parameters:
    TaskRef:
      name: ref
      in: path
      required: true
      description: The task's ref (`<initiative slug>-<seq>`) or ULID, in either letter case.
      schema:
        type: string
    BlockedByRef:
      name: blockedByRef
      in: path
      required: true
      description: The ref or ULID, in either letter case, of the task that blocks.
      schema:
        type: string
    LeaseRef:
      name: ref
      in: path
      required: true
      description: The lease's ref (`L<n>`, either letter case) or ULID.
      schema:
        type: string
    EventLimit:
      name: limit
      in: query
      required: false
      description: The page size, 1 to 1000. Default 100.
      schema:
        type: integer
    EventAfter:
      name: after
      in: query
      required: false
      description: An event id or `E<n>` ref. The page starts after it.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        A valid key was presented without a `Board-Actor` header or with a
        `Board-Actor-Meta` header that is not a JSON object, or the request
        body or a parameter is not acceptable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No credential, or an unknown, revoked or expired key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: There is no such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what exists, such as a name already taken.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The lease has expired. The problem carries `expired_at`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The account may not log in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: The identity provider could not be reached or refused the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The service cannot take the request right now.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Key:
      type: object
      description: An API key as the board stores it. It never holds the key itself.
      required: [id, name, display_prefix, status, created_at, created_by]
      properties:
        id:
          type: string
          description: The key's ULID.
        name:
          type: string
          description: The key's unique name, such as `workstation`.
        display_prefix:
          type: string
          description: The 8 characters after `brd_`, which tell keys apart.
        status:
          type: string
          enum: [active, expired, revoked]
          description: The key's state now.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: The principal that created the key, `key:<name>` or `oidc:<email>`, or `admin-cli`.
        last_used_at:
          type: string
          format: date-time
          description: When the key was last used, to within 30 seconds. Absent when it never was.
        expires_at:
          type: string
          format: date-time
          description: When the key stops working. Absent for a key that does not expire.
        revoked_at:
          type: string
          format: date-time
          description: When the key was revoked. Absent for a key that was not.
    KeyList:
      type: object
      description: The API keys.
      required: [items]
      properties:
        items:
          type: array
          description: Every key, oldest first.
          items:
            $ref: "#/components/schemas/Key"
    KeyCreate:
      type: object
      description: A new API key.
      required: [name]
      properties:
        name:
          type: string
          description: 1-64 characters of a-z, A-Z, 0-9, `.`, `_` or `-`, starting with a letter or digit. Unique.
        expires_in:
          type: string
          description: A positive count of days or hours, like `90d` or `12h`, at most 36500 days. Omitted, the key does not expire.
          examples: [90d]
    CreatedKey:
      description: A key just created. `key` is shown this once.
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The API key, `brd_` and 52 characters. Never returned again.
    Initiative:
      type: object
      description: An initiative with its tags.
      required: [id, ref, slug, title, description, status, tags, created_by, created_at]
      properties:
        id:
          type: string
          description: The initiative's ULID.
        ref:
          type: string
          description: The short ref, which is the slug.
        slug:
          type: string
          description: The unique slug, 2 to 40 characters of `a-z`, `0-9` and `-`.
          examples: [phone-onboard]
        title:
          type: string
        description:
          type: string
          description: Markdown. Empty when none was given.
        status:
          type: string
          enum: [open, closed]
        tags:
          type: array
          description: The tags, sorted.
          items:
            type: string
        target_start:
          type: string
          format: date
          description: The planned start. Absent when none was given.
        target_end:
          type: string
          format: date
          description: The planned end. Absent when none was given.
        created_by:
          type: string
          description: The handle of the actor that created it.
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          description: When it was closed. Absent while it is open.
        closed_by:
          type: string
          description: The handle of the actor that closed it. Absent while it is open.
    InitiativeListItem:
      description: An initiative of a list, with the counts of its tasks and its live leases.
      allOf:
        - $ref: "#/components/schemas/Initiative"
        - type: object
          required: [counts, live_leases]
          properties:
            counts:
              $ref: "#/components/schemas/TaskCounts"
            live_leases:
              type: integer
              description: How many live leases sit on the initiative's tasks.
    TaskCounts:
      type: object
      description: How many tasks an initiative holds in each status.
      required: [open, done, closed]
      properties:
        open:
          type: integer
        done:
          type: integer
        closed:
          type: integer
    InitiativeList:
      type: object
      description: A page of initiatives.
      required: [items]
      properties:
        items:
          type: array
          description: The initiatives of the page, ordered by id.
          items:
            $ref: "#/components/schemas/InitiativeListItem"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    InitiativeCreate:
      type: object
      description: A new initiative.
      required: [slug, title]
      properties:
        slug:
          type: string
          description: 2 to 40 characters of `a-z`, `0-9` and `-`. Unique.
          examples: [phone-onboard]
        title:
          type: string
          description: 1 to 200 characters.
        description:
          type: string
          description: Markdown, at most 20000 characters.
        tags:
          type: array
          description: >-
            At most 20 tags, each lowercase letters, digits, `.`, `_`, `:` or `-`, starting with a letter or
            digit, at most 40 characters. Trimmed, lowercased and deduplicated.
          items:
            type: string
        target_start:
          type: string
          format: date
        target_end:
          type: string
          format: date
          description: Not before `target_start`.
    InitiativePatch:
      type: object
      description: >-
        The fields to change. A field left out keeps its value. `null` clears `target_start` and `target_end`,
        and is 400 for the others.
      properties:
        title:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: 1 to 200 characters.
        description:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Markdown, at most 20000 characters.
        tags:
          type: [array, "null"]
          x-go-type: Maybe[[]string]
          x-go-type-skip-optional-pointer: true
          description: Replaces the set. At most 20 tags, normalised as for a create.
          items:
            type: string
        target_start:
          type: [string, "null"]
          format: date
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
        target_end:
          type: [string, "null"]
          format: date
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Not before `target_start`.
        slug:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
    ExternalRef:
      type: object
      description: A link to a ticket, pull request or build.
      required: [label, url]
      properties:
        label:
          type: string
          description: 1 to 80 characters.
        url:
          type: string
          description: An `http` or `https` URL.
    TaskLink:
      type: object
      description: A task on the other end of a dependency.
      required: [ref, title, status]
      properties:
        ref:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [open, done, closed]
    Lease:
      type: object
      description: A lease on a task, with its resources.
      required: [id, ref, task, actor, intent, ttl_seconds, started_at, renewed_at, expires_at, state, resources]
      properties:
        id:
          type: string
          description: The lease's ULID.
        ref:
          type: string
          description: The short ref, `L<n>`.
        task:
          type: string
          description: The ref of the task it is on.
        actor:
          type: string
          description: The handle of the actor that holds it.
        intent:
          type: string
        ttl_seconds:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        renewed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [live, ended, expired]
        resources:
          type: array
          description: The resources it holds, sorted.
          items:
            type: string
        ended_at:
          type: string
          format: date-time
        ended_by:
          type: string
          description: The handle of the actor that ended it, when that was not the holder.
        outcome:
          type: string
        acked_at:
          type: string
          format: date-time
        acked_by:
          type: string
    Task:
      type: object
      description: A task. `active`, `blocked` and `overdue` are derived.
      required: [id, ref, initiative, seq, title, description, kind, status, external_refs, created_by, created_at,
                 updated_at, active, blocked, overdue]
      properties:
        id:
          type: string
          description: The task's ULID.
        ref:
          type: string
          description: The short ref, `<initiative slug>-<seq>`.
          examples: [phone-onboard-3]
        initiative:
          type: string
          description: The slug of the initiative it belongs to.
        seq:
          type: integer
          description: The number within the initiative, from 1.
        title:
          type: string
        description:
          type: string
          description: Markdown. Empty when none was given.
        kind:
          type: string
          enum: [work, watch]
        status:
          type: string
          enum: [open, done, closed]
        resolution:
          type: string
          enum: [completed, dropped, superseded, duplicate]
          description: Why it was closed. Absent unless it is closed.
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        cadence_seconds:
          type: integer
          format: int64
          description: Watch tasks only.
        next_check_at:
          type: string
          format: date-time
          description: Watch tasks only.
        external_refs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"
        created_by:
          type: string
          description: The handle of the actor that created it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        done_at:
          type: string
          format: date-time
        done_by:
          type: string
        closed_at:
          type: string
          format: date-time
        closed_by:
          type: string
        active:
          type: boolean
          description: It has a live lease.
        blocked:
          type: boolean
          description: It has an open dependency, one whose blocking task is not closed.
        overdue:
          type: boolean
          description: A watch task, not closed, whose `next_check_at` is before now.
    TaskDetail:
      description: A task with its dependencies and live leases.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [deps, blocking, live_leases]
          properties:
            deps:
              type: array
              description: The tasks it is blocked by, in creation order.
              items:
                $ref: "#/components/schemas/TaskLink"
            blocking:
              type: array
              description: The tasks that are blocked by it, in creation order.
              items:
                $ref: "#/components/schemas/TaskLink"
            live_leases:
              type: array
              description: Its live leases, oldest first.
              items:
                $ref: "#/components/schemas/Lease"
    TaskListItem:
      description: A task of a list, with its live leases.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [live_leases]
          properties:
            live_leases:
              type: array
              description: Its live leases, oldest first.
              items:
                $ref: "#/components/schemas/Lease"
    TaskList:
      type: object
      description: A page of tasks.
      required: [items]
      properties:
        items:
          type: array
          description: The tasks of the page, ordered by id.
          items:
            $ref: "#/components/schemas/TaskListItem"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    TaskCreate:
      type: object
      description: A new task.
      required: [initiative, title]
      properties:
        initiative:
          type: string
          description: The slug or ULID of an open initiative.
        title:
          type: string
          description: 1 to 200 characters.
        description:
          type: string
          description: Markdown, at most 20000 characters.
        kind:
          type: string
          enum: [work, watch]
          description: Default `work`.
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
          description: Not before `planned_start`.
        cadence_seconds:
          type: integer
          format: int64
          description: Watch tasks only, and required there. 60 to 31536000.
        next_check_at:
          type: string
          format: date-time
          description: Watch tasks only. Default now plus `cadence_seconds`.
        external_refs:
          type: array
          description: At most 20.
          items:
            $ref: "#/components/schemas/ExternalRef"
        blocked_by:
          type: array
          description: Refs or ULIDs of the tasks the new task starts out blocked by.
          items:
            type: string
    InitiativeClose:
      type: object
      properties:
        force:
          type: boolean
          description: >-
            Close the tasks that are not closed as `dropped` and then the initiative. Without it, an initiative with
            such a task is not closed.
          examples: [true]
    TaskClose:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          description: Required. Why the task is closed. One of `completed`, `dropped`, `superseded` or `duplicate`.
          examples: [completed]
    TaskCheck:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: Required, 1 to 200 characters. What the check found.
        next_check_at:
          type: string
          format: date-time
          description: When the next check is due. Default is now plus the task's cadence.
    TaskMilestone:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: Required, 1 to 200 characters.
        data:
          type: object
          additionalProperties: true
          description: Anything to record with the milestone, kept under the event's `data.data`.
    Event:
      type: object
      description: One row of the audit trail.
      required: [id, ref, at, type, actor, principal, summary, data]
      properties:
        id:
          type: string
          description: The event's ULID.
        ref:
          type: string
          description: The short ref `E<n>`.
          examples: [E42]
        at:
          type: string
          format: date-time
        type:
          type: string
          examples: [task_done]
        actor:
          type: string
          description: The handle of the actor the event was written as.
        principal:
          type: string
          description: The principal that authenticated.
        initiative:
          type: string
          description: The slug of the initiative the event names. Absent when it names none.
        task:
          type: string
          description: The ref of the task the event names. Absent when it names none.
        ref_id:
          type: string
          description: The id of the object the event is about. Absent when it has none.
        summary:
          type: string
          description: A one-line description.
        data:
          type: object
          additionalProperties: true
    LeaseStart:
      type: object
      description: The lease to start.
      required: [task, intent]
      properties:
        task:
          type: string
          description: The task's ref or ULID.
        intent:
          type: string
          description: One line on what the actor is doing, 1 to 200 characters.
        ttl_seconds:
          type: integer
          format: int64
          description: Clamped to 60 to 43200. Default 7200.
        resources:
          type: array
          description: At most 20 strings of 1 to 100 characters, repeats dropped.
          items:
            type: string
    LeaseRenew:
      type: object
      description: What to change on a renewal. A field left out keeps its value.
      properties:
        ttl_seconds:
          type: integer
          format: int64
          description: Clamped to 60 to 43200. Left out keeps the lease's ttl.
        intent:
          type: string
        resources:
          type: array
          items:
            type: string
    LeaseEnd:
      type: object
      description: How the lease ended.
      properties:
        outcome:
          type: string
          description: At most 200 characters.
    LeaseConflict:
      type: object
      description: A live lease of another that holds a resource of the one asked about.
      required: [lease, holder, task, intent, expires_at, resources]
      properties:
        lease:
          type: string
          description: The conflicting lease's ref, `L<n>`.
        holder:
          type: string
          description: The handle of the actor that holds it.
        task:
          type: string
          description: The ref of the task it is on.
        intent:
          type: string
        expires_at:
          type: string
          format: date-time
        resources:
          type: array
          description: The resources both leases hold.
          items:
            type: string
    LeaseResult:
      type: object
      description: A lease with the live leases of others that conflict with it.
      required: [lease, conflicts]
      properties:
        lease:
          $ref: "#/components/schemas/Lease"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/LeaseConflict"
    NowLease:
      description: One of the caller's live leases, with the title of its task.
      allOf:
        - $ref: "#/components/schemas/Lease"
        - type: object
          required: [title]
          properties:
            title:
              type: string
              description: The title of the lease's task.
    Now:
      type: object
      description: The caller's check-in, in its lease and conflict parts.
      required: [actor, my_leases, others_leases, conflicts]
      properties:
        actor:
          type: string
          description: The handle of the caller's actor.
        my_leases:
          type: array
          description: The caller's live leases, oldest first.
          items:
            $ref: "#/components/schemas/NowLease"
        others_leases:
          type: array
          description: The live leases of other actors, oldest first.
          items:
            $ref: "#/components/schemas/Lease"
        conflicts:
          type: array
          description: >-
            The live leases that hold a resource of one of the caller's live leases, and the live leases of other actors
            that hold one of the resources asked about, in lease-number order, each once.
          items:
            $ref: "#/components/schemas/LeaseConflict"
    LeaseList:
      type: object
      description: A page of leases.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lease"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    EventList:
      type: object
      description: A page of events.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    TaskPatch:
      type: object
      description: >-
        The fields to change. A field left out keeps its value. `null` clears `planned_start`, `planned_end` and
        `next_check_at`, and is 400 for the others, `cadence_seconds` included.
      properties:
        title:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: 1 to 200 characters.
        description:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Markdown, at most 20000 characters.
        planned_start:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
        planned_end:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
        cadence_seconds:
          type: [integer, "null"]
          format: int64
          x-go-type: Maybe[int64]
          x-go-type-skip-optional-pointer: true
          description: Watch tasks only, and never cleared. 60 to 31536000.
        next_check_at:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
          description: Watch tasks only.
        external_refs:
          type: [array, "null"]
          x-go-type: Maybe[[]ExternalRef]
          x-go-type-skip-optional-pointer: true
          description: Replaces the list. At most 20.
          items:
            $ref: "#/components/schemas/ExternalRef"
        kind:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
        initiative:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
    Session:
      type: object
      description: A browser session.
      required: [email, principal, actor, csrf_token]
      properties:
        email:
          type: string
          description: The verified email the session belongs to.
        principal:
          type: string
          description: Who authenticated, `oidc:<email>`.
        actor:
          type: string
          description: The actor the session acts as, the operator handle.
        csrf_token:
          type: string
          description: The value cookie-authenticated writes send as `X-CSRF-Token`.
    Meta:
      type: object
      description: The server and the caller.
      required: [version, protocol, principal, actor]
      properties:
        version:
          type: string
          description: The version the server binary was built as.
        protocol:
          type: integer
          description: The agent protocol version the server binary embeds (`board help agent`).
        principal:
          type: string
          description: Who authenticated, such as `key:workstation` or `oidc:<email>`.
        actor:
          type: string
          description: The actor the request acts as.
    ProtocolSeenRequest:
      type: object
      description: The agent protocol version the caller has read.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
          description: The protocol version, as `board help agent --version` prints it.
    ProtocolSeen:
      type: object
      description: An actor and the highest agent protocol version it has read.
      required: [actor, protocol_seen]
      properties:
        actor:
          type: string
          description: The actor's handle.
        protocol_seen:
          type: integer
          description: The highest protocol version this actor has read.
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
        instance:
          type: string
          description: A URI reference that identifies this occurrence.
        next:
          type: string
          description: The suggested next action, a sentence the CLI prints.
        expired_at:
          type: string
          format: date-time
          description: On the 410 of a lease renewal, when the lease expired.
