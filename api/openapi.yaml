openapi: 3.1.0
info:
  title: Board API
  version: 0.1.0
  summary: The board server's HTTP API.
  description: >-
    The document declares the probe, documentation, browser-login, API-key, initiative and task operations.
    Every later operation is added here first; the Go server code and the TypeScript client are generated from
    this document and ci/lint.sh fails when either is stale.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: probes
    description: Liveness and readiness.
  - name: docs
    description: This document and the interactive API documentation.
  - name: auth
    description: Browser login through OpenID Connect, and the browser session.
  - name: keys
    description: API keys for agents, created, listed and revoked by any authenticated principal.
  - name: initiatives
    description: Initiatives, the groups of tasks, with tags.
  - name: tasks
    description: Tasks, the units of work and the watches, created, read and edited.
  - name: meta
    description: The server's versions, the caller, and the agent protocol the caller has read.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [probes]
      summary: Liveness probe
      description: Answers 200 whenever the process is up. The only unauthenticated operation.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [probes]
      summary: Readiness probe
      description: >-
        Answers 200 when the database is reachable and migrated, 503 otherwise.
        A presented key the database cannot check also gets 503, as a problem document.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The server is ready.
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The server is not ready.
          content:
            text/plain:
              schema:
                type: string
                examples: [not ready]
  /api/openapi.yaml:
    get:
      operationId: getOpenapiYAML
      tags: [docs]
      summary: This document as YAML
      description: Serves api/openapi.yaml, the source of truth for the API.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/openapi.json:
    get:
      operationId: getOpenapiJSON
      tags: [docs]
      summary: This document as JSON
      description: The same document as /api/openapi.yaml, converted to JSON.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/docs:
    get:
      operationId: getDocs
      tags: [docs]
      summary: Interactive API documentation
      description: >-
        Swagger UI, served from assets embedded in the binary, listing every
        operation of this document. Its Authorize button takes a `bearerAuth` key.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The documentation page.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/docs/assets/{name}:
    get:
      operationId: getDocsAsset
      tags: [docs]
      summary: A Swagger UI asset
      description: A script or stylesheet of the page at /api/docs, embedded in the binary.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The asset's file name.
          schema:
            type: string
      responses:
        "200":
          description: The asset.
          content:
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List the API keys
      description: >-
        Every key, oldest first. A key is described by its name and display prefix
        only: the key itself is shown once, by the response that created it, and is
        stored nowhere.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createKey
      tags: [keys]
      summary: Create an API key
      description: >-
        Makes a key called `name`, with an optional expiry, and returns the key in
        `key` exactly once. Appends a `key_created` event that records the
        caller's principal and `Board-Actor` handle in separate columns.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCreate"
      responses:
        "201":
          description: The key was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/keys/{name}/revoke:
    post:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke an API key
      description: >-
        Sets `revoked_at`, so the key gets 401 from its next request on. Revoking a
        revoked key changes nothing and answers 200 with the first revocation time.
        A revocation that happens appends a `key_revoked` event.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The key's name.
          schema:
            type: string
      responses:
        "200":
          description: The key, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives:
    get:
      operationId: listInitiatives
      tags: [initiatives]
      summary: List the initiatives
      description: >-
        A page of initiatives ordered by id (creation order). `tag` may repeat and keeps
        the initiatives that carry every tag given. `limit` is 1 to 1000, default 100.
        `after` is the id or slug of the last initiative of the previous page; the
        response's `next_after` is the value to send, and is absent on the last page.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          description: Keep initiatives that carry this tag. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          description: The page size, 1 to 1000. Default 100.
          schema:
            type: integer
        - name: after
          in: query
          required: false
          description: An initiative ULID or slug, in either letter case. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createInitiative
      tags: [initiatives]
      summary: Create an initiative
      description: >-
        Makes an initiative with a slug of 2 to 40 characters of `a-z`, `0-9` and `-`.
        A slug already taken is 409 with a `next` that says how to read it. Appends an
        `initiative_created` event that records the caller's principal and `Board-Actor`
        handle in separate columns, and upserts the actor.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeCreate"
      responses:
        "201":
          description: The initiative was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}:
    get:
      operationId: getInitiative
      tags: [initiatives]
      summary: Read an initiative
      description: The initiative whose slug (its ref) or ULID is given.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      responses:
        "200":
          description: The initiative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks:
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: >-
        Makes a task in an open initiative, numbered `<slug>-<seq>` from 1 within it and never reused.
        `kind` is `work` (the default) or `watch`. A watch task needs `cadence_seconds` (60 to 31536000) and
        its `next_check_at` defaults to now plus the cadence. A work task that sends either watch field is 400.
        `blocked_by` names tasks (ref or ULID) the new task starts out blocked by. A bad field is 400 and
        writes no row, event or actor. An unknown initiative or blocker is 404 and a closed initiative is 409.
        Appends `task_created`, and `dep_added` for each blocker.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The task was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Read a task
      description: >-
        The task whose ref (`<slug>-<seq>`) or ULID is given, in either letter case, with the tasks it is blocked
        by (`deps`), the tasks it blocks (`blocking`), its live leases and the derived `active`, `blocked` and
        `overdue`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: patchTask
      tags: [tasks]
      summary: Edit a task
      description: >-
        Changes the fields sent. A field left out keeps its value, `null` clears `planned_start`, `planned_end`,
        `cadence_seconds` and `next_check_at`, and `external_refs` replaces the list. `kind` and `initiative` are
        immutable, and sending either is 400. A patch that changes nothing answers 200 and writes no row, event or
        actor. A change appends `task_updated` whose `data.changed` names the changed fields. A closed task, or a
        task of a closed initiative, is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The task after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Describe the server and the caller
      description: >-
        The server's version, the agent protocol version its binary embeds (the one
        `board help agent` prints), and who the caller is: the principal that
        authenticated and the actor it acts as. Reads nothing from the database.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The server and the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/actors/me/protocol-seen:
    put:
      operationId: putProtocolSeen
      tags: [meta]
      summary: Record that the calling actor has read an agent protocol version
      description: >-
        Sets the calling actor's `protocol_seen` to `version` when that is higher than
        what is recorded (the column holds the highest version read, so repeating a call,
        or sending an older version, changes nothing) and upserts the actor. A negative
        `version` is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtocolSeenRequest"
      responses:
        "200":
          description: The actor with the highest protocol version it has read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolSeen"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/login:
    get:
      operationId: getAuthLogin
      tags: [auth]
      summary: Start the browser login
      description: >-
        A browser navigation (a GET that accepts `text/html`) is redirected to the
        identity provider's authorization endpoint with PKCE (S256), `state` and
        `nonce`, and gets a short-lived HttpOnly pre-login cookie. Any other
        request with no credential is an API call and gets 401.
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The provider's authorization endpoint with the login's parameters.
              schema:
                type: string
            Set-Cookie:
              description: The pre-login cookie `board_login`, HttpOnly, Secure, SameSite=Lax, valid 10 minutes.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          description: >-
            Any status not listed here is a problem document. A login never answers
            2xx: it ends in a redirect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      tags: [auth]
      summary: Finish the browser login
      description: >-
        The fixed redirect URI registered with the identity provider, called with the
        query parameters `code`, `state` and, when the provider refused the login,
        `error`, and the pre-login cookie `board_login`. It spends the
        login's `state`, `nonce` and PKCE verifier, checks the ID token, admits only
        a verified email on the allowed list, and starts the session. Like
        `/auth/login` it answers a browser navigation, and any other request with
        no credential gets 401.
      security: []
      responses:
        "302":
          description: The login succeeded. Redirects to `/` and sets the session cookie `board_session`.
          headers:
            Location:
              description: Where the browser lands.
              schema:
                type: string
            Set-Cookie:
              description: The session cookie, HttpOnly, Secure, SameSite=Lax.
              schema:
                type: string
        "400":
          description: >-
            The callback does not belong to a login in progress (no pre-login
            cookie and so no PKCE verifier, `state` mismatch, no code) or the ID
            token carries another login's `nonce`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        default:
          description: >-
            Any status not listed here is a problem document. A login never answers
            2xx: it ends in a redirect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: The caller's browser session
      description: >-
        Describes the session the cookie names: the principal, the actor it acts
        as (the operator), and the session's CSRF token.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the browser session
      description: Deletes the session server-side and clears the cookie. A cookie-authenticated write needs the X-CSRF-Token header and a same-origin Origin (SPEC 3.2), or the request is refused with 403 before it runs.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The session is ended.
          headers:
            Set-Cookie:
              description: The session cookie, cleared.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key minted by `board admin keys create`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: board_session
      description: The operator's browser session.
  parameters:
    TaskRef:
      name: ref
      in: path
      required: true
      description: The task's ref (`<initiative slug>-<seq>`) or ULID, in either letter case.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        A valid key was presented without a `Board-Actor` header or with a
        `Board-Actor-Meta` header that is not a JSON object, or the request
        body or a parameter is not acceptable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No credential, or an unknown, revoked or expired key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: There is no such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what exists, such as a name already taken.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The account may not log in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: The identity provider could not be reached or refused the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The service cannot take the request right now.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Key:
      type: object
      description: An API key as the board stores it. It never holds the key itself.
      required: [id, name, display_prefix, status, created_at, created_by]
      properties:
        id:
          type: string
          description: The key's ULID.
        name:
          type: string
          description: The key's unique name, such as `workstation`.
        display_prefix:
          type: string
          description: The 8 characters after `brd_`, which tell keys apart.
        status:
          type: string
          enum: [active, expired, revoked]
          description: The key's state now.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: The principal that created the key, `key:<name>` or `oidc:<email>`, or `admin-cli`.
        last_used_at:
          type: string
          format: date-time
          description: When the key was last used, to within 30 seconds. Absent when it never was.
        expires_at:
          type: string
          format: date-time
          description: When the key stops working. Absent for a key that does not expire.
        revoked_at:
          type: string
          format: date-time
          description: When the key was revoked. Absent for a key that was not.
    KeyList:
      type: object
      description: The API keys.
      required: [items]
      properties:
        items:
          type: array
          description: Every key, oldest first.
          items:
            $ref: "#/components/schemas/Key"
    KeyCreate:
      type: object
      description: A new API key.
      required: [name]
      properties:
        name:
          type: string
          description: 1-64 characters of a-z, A-Z, 0-9, `.`, `_` or `-`, starting with a letter or digit. Unique.
        expires_in:
          type: string
          description: A positive count of days or hours, like `90d` or `12h`, at most 36500 days. Omitted, the key does not expire.
          examples: [90d]
    CreatedKey:
      description: A key just created. `key` is shown this once.
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The API key, `brd_` and 52 characters. Never returned again.
    Initiative:
      type: object
      description: An initiative with its tags.
      required: [id, ref, slug, title, description, status, tags, created_by, created_at]
      properties:
        id:
          type: string
          description: The initiative's ULID.
        ref:
          type: string
          description: The short ref, which is the slug.
        slug:
          type: string
          description: The unique slug, 2 to 40 characters of `a-z`, `0-9` and `-`.
          examples: [phone-onboard]
        title:
          type: string
        description:
          type: string
          description: Markdown. Empty when none was given.
        status:
          type: string
          enum: [open, closed]
        tags:
          type: array
          description: The tags, sorted.
          items:
            type: string
        target_start:
          type: string
          format: date
          description: The planned start. Absent when none was given.
        target_end:
          type: string
          format: date
          description: The planned end. Absent when none was given.
        created_by:
          type: string
          description: The handle of the actor that created it.
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          description: When it was closed. Absent while it is open.
        closed_by:
          type: string
          description: The handle of the actor that closed it. Absent while it is open.
    InitiativeList:
      type: object
      description: A page of initiatives.
      required: [items]
      properties:
        items:
          type: array
          description: The initiatives of the page, ordered by id.
          items:
            $ref: "#/components/schemas/Initiative"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    InitiativeCreate:
      type: object
      description: A new initiative.
      required: [slug, title]
      properties:
        slug:
          type: string
          description: 2 to 40 characters of `a-z`, `0-9` and `-`. Unique.
          examples: [phone-onboard]
        title:
          type: string
          description: 1 to 200 characters.
        description:
          type: string
          description: Markdown, at most 20000 characters.
        tags:
          type: array
          description: >-
            At most 20 tags, each lowercase letters, digits, `.`, `_`, `:` or `-`, starting with a letter or
            digit, at most 40 characters. Trimmed, lowercased and deduplicated.
          items:
            type: string
        target_start:
          type: string
          format: date
        target_end:
          type: string
          format: date
          description: Not before `target_start`.
    ExternalRef:
      type: object
      description: A link to a ticket, pull request or build.
      required: [label, url]
      properties:
        label:
          type: string
          description: 1 to 80 characters.
        url:
          type: string
          description: An `http` or `https` URL.
    TaskLink:
      type: object
      description: A task on the other end of a dependency.
      required: [ref, title, status]
      properties:
        ref:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [open, done, closed]
    Lease:
      type: object
      description: A lease on a task, with its resources.
      required: [id, ref, task, actor, intent, ttl_seconds, started_at, renewed_at, expires_at, state, resources]
      properties:
        id:
          type: string
          description: The lease's ULID.
        ref:
          type: string
          description: The short ref, `L<n>`.
        task:
          type: string
          description: The ref of the task it is on.
        actor:
          type: string
          description: The handle of the actor that holds it.
        intent:
          type: string
        ttl_seconds:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        renewed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [live, ended, expired]
        resources:
          type: array
          description: The resources it holds, sorted.
          items:
            type: string
        ended_at:
          type: string
          format: date-time
        ended_by:
          type: string
          description: The handle of the actor that ended it, when that was not the holder.
        outcome:
          type: string
        acked_at:
          type: string
          format: date-time
        acked_by:
          type: string
    Task:
      type: object
      description: A task. `active`, `blocked` and `overdue` are derived.
      required: [id, ref, initiative, seq, title, description, kind, status, external_refs, created_by, created_at,
                 updated_at, active, blocked, overdue]
      properties:
        id:
          type: string
          description: The task's ULID.
        ref:
          type: string
          description: The short ref, `<initiative slug>-<seq>`.
          examples: [phone-onboard-3]
        initiative:
          type: string
          description: The slug of the initiative it belongs to.
        seq:
          type: integer
          description: The number within the initiative, from 1.
        title:
          type: string
        description:
          type: string
          description: Markdown. Empty when none was given.
        kind:
          type: string
          enum: [work, watch]
        status:
          type: string
          enum: [open, done, closed]
        resolution:
          type: string
          enum: [completed, dropped, superseded, duplicate]
          description: Why it was closed. Absent unless it is closed.
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        cadence_seconds:
          type: integer
          format: int64
          description: Watch tasks only.
        next_check_at:
          type: string
          format: date-time
          description: Watch tasks only.
        external_refs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"
        created_by:
          type: string
          description: The handle of the actor that created it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        done_at:
          type: string
          format: date-time
        done_by:
          type: string
        closed_at:
          type: string
          format: date-time
        closed_by:
          type: string
        active:
          type: boolean
          description: It has a live lease.
        blocked:
          type: boolean
          description: It has an open dependency, one whose blocking task is not closed.
        overdue:
          type: boolean
          description: A watch task, not closed, whose `next_check_at` is before now.
    TaskDetail:
      description: A task with its dependencies and live leases.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [deps, blocking, live_leases]
          properties:
            deps:
              type: array
              description: The tasks it is blocked by, in creation order.
              items:
                $ref: "#/components/schemas/TaskLink"
            blocking:
              type: array
              description: The tasks that are blocked by it, in creation order.
              items:
                $ref: "#/components/schemas/TaskLink"
            live_leases:
              type: array
              description: Its live leases, oldest first.
              items:
                $ref: "#/components/schemas/Lease"
    TaskCreate:
      type: object
      description: A new task.
      required: [initiative, title]
      properties:
        initiative:
          type: string
          description: The slug or ULID of an open initiative.
        title:
          type: string
          description: 1 to 200 characters.
        description:
          type: string
          description: Markdown, at most 20000 characters.
        kind:
          type: string
          enum: [work, watch]
          description: Default `work`.
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
          description: Not before `planned_start`.
        cadence_seconds:
          type: integer
          format: int64
          description: Watch tasks only, and required there. 60 to 31536000.
        next_check_at:
          type: string
          format: date-time
          description: Watch tasks only. Default now plus `cadence_seconds`.
        external_refs:
          type: array
          description: At most 20.
          items:
            $ref: "#/components/schemas/ExternalRef"
        blocked_by:
          type: array
          description: Refs or ULIDs of the tasks the new task starts out blocked by.
          items:
            type: string
    TaskPatch:
      type: object
      description: >-
        The fields to change. A field left out keeps its value. `null` clears `planned_start`, `planned_end`,
        `cadence_seconds` and `next_check_at`, and is 400 for the others.
      properties:
        title:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: 1 to 200 characters.
        description:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Markdown, at most 20000 characters.
        planned_start:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
        planned_end:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
        cadence_seconds:
          type: [integer, "null"]
          format: int64
          x-go-type: Maybe[int64]
          x-go-type-skip-optional-pointer: true
          description: Watch tasks only. 60 to 31536000.
        next_check_at:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
          description: Watch tasks only.
        external_refs:
          type: [array, "null"]
          x-go-type: Maybe[[]ExternalRef]
          x-go-type-skip-optional-pointer: true
          description: Replaces the list. At most 20.
          items:
            $ref: "#/components/schemas/ExternalRef"
        kind:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
        initiative:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
    Session:
      type: object
      description: A browser session.
      required: [email, principal, actor, csrf_token]
      properties:
        email:
          type: string
          description: The verified email the session belongs to.
        principal:
          type: string
          description: Who authenticated, `oidc:<email>`.
        actor:
          type: string
          description: The actor the session acts as, the operator handle.
        csrf_token:
          type: string
          description: The value cookie-authenticated writes send as `X-CSRF-Token`.
    Meta:
      type: object
      description: The server and the caller.
      required: [version, protocol, principal, actor]
      properties:
        version:
          type: string
          description: The version the server binary was built as.
        protocol:
          type: integer
          description: The agent protocol version the server binary embeds (`board help agent`).
        principal:
          type: string
          description: Who authenticated, such as `key:workstation` or `oidc:<email>`.
        actor:
          type: string
          description: The actor the request acts as.
    ProtocolSeenRequest:
      type: object
      description: The agent protocol version the caller has read.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
          description: The protocol version, as `board help agent --version` prints it.
    ProtocolSeen:
      type: object
      description: An actor and the highest agent protocol version it has read.
      required: [actor, protocol_seen]
      properties:
        actor:
          type: string
          description: The actor's handle.
        protocol_seen:
          type: integer
          description: The highest protocol version this actor has read.
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
        instance:
          type: string
          description: A URI reference that identifies this occurrence.
        next:
          type: string
          description: The suggested next action, a sentence the CLI prints.
