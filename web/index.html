<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Runs before the app bundle so the first paint already has the effective theme. The rule is
      // web/src/lib/theme.ts's (setting from localStorage, unknown = System, System = prefers-color-scheme).
      (function () {
        var setting = null;
        try {
          setting = localStorage.getItem('board.theme');
        } catch (e) {}
        var dark = setting === 'dark' || (setting !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#14161a' : '#f6f7f9');
      })();
    </script>
    <title>board</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
